# Everything on one virtual machine (for example a Hetzner VPS):
#   app    the website plus the voice backend
#   caddy  the web server in front, with automatic HTTPS certificates
# Start with: docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://frontdeskai.co.za}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-PLACEHOLDER_GOOGLE_SITE_VERIFICATION}
    env_file: .env
    environment:
      PORT: "8787"
      TRUST_PROXY: "true"
    restart: unless-stopped
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-frontdeskai.co.za}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
